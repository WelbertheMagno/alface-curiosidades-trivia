<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Interativo do Plantio de Alface 🥬</title>
    <style>
        :root {
            --primary-green: #2E8B57;
            --light-green: #E8F5E9;
            --hover-green: #C8E6C9;
            --earth-brown: #8B4513;
            --text-dark: #333333;
            --bg-color: #F4F7F4;
            --correct: #4CAF50;
            --incorrect: #F44336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 4px solid var(--primary-green);
        }

        .quiz-content {
            padding: 30px;
        }

        h1 {
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--earth-brown);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--light-green);
            border: 2px solid var(--primary-green);
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            color: var(--text-dark);
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-green);
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background-color: var(--incorrect);
            color: white;
            border-color: var(--incorrect);
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .feedback-box.error {
            background-color: #FFEBEE;
            border-left: 4px solid var(--incorrect);
            color: #C62828;
        }

        .feedback-box.success {
            background-color: #E8F5E9;
            border-left: 4px solid var(--correct);
            color: #2E7D32;
        }

        .next-btn, .restart-btn {
            background-color: var(--earth-brown);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            display: none;
            transition: background-color 0.3s ease;
        }

        .next-btn:hover, .restart-btn:hover {
            background-color: #6b3410;
        }

        .results {
            text-align: center;
            display: none;
        }

        .results h2 {
            color: var(--primary-green);
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Substitua 'watermarked_img_10223752292266313544.jpg' pelo caminho da imagem de capa, se renomear -->
        <img src="capa-alface.jpg" alt="Horta de alfaces" class="header-image">
        
        <div class="quiz-content">
            <h1>Cuidados no Plantio da Alface Crespa 🥬</h1>
            <p style="text-align:center; margin:-8px 0 20px; color:#555; line-height:1.5;">Lactuca sativa — acompanhamento do plantio em copos descartáveis até os primeiros brotos.</p>
            
            <div id="quiz-section">
                <div id="progress" style="text-align: right; color: #666; font-size: 0.9rem; margin-bottom: 10px;"></div>
                <div class="question-text" id="question">Carregando pergunta...</div>
                <div class="options-container" id="options">
                    <!-- Botões gerados via JS -->
                </div>
                
                <div class="feedback-box" id="feedback"></div>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima Pergunta</button>
            </div>

            <div id="results-section" class="results">
                <h2>Trívia Concluída! 🥬</h2>
                <p id="score-text"></p>
                <button class="restart-btn" id="restart-btn" style="display: block;" onclick="restartQuiz()">Tentar Novamente</button>
            </div>
        </div>
    </div>

    <script>
        // Array com as perguntas, alternativas incorretas geradas e a explicação.
        const questions = [
            {
                question: "1. Por que os copos descartáveis foram furados no fundo antes do plantio?",
                options: [
                    { text: "Para permitir a drenagem do excesso de água e evitar que o substrato fique encharcado.", correct: true },
                    { text: "Para que todo o substrato caia do copo durante a rega.", correct: false },
                    { text: "Porque as sementes de alface só germinam quando ficam sem substrato.", correct: false }
                ],
                explanation: "Os furos no fundo permitem que o excesso de água escorra. Isso ajuda a manter a umidade adequada sem deixar o substrato encharcado."
            },
            {
                question: "2. A que profundidade as sementes de alface crespa foram colocadas?",
                options: [
                    { text: "A aproximadamente 5 cm de profundidade.", correct: false },
                    { text: "A aproximadamente 0,5 cm de profundidade.", correct: true },
                    { text: "Na parte de baixo do copo, junto aos furos de drenagem.", correct: false }
                ],
                explanation: "As sementes foram colocadas a cerca de 0,5 cm de profundidade. Como são pequenas, o plantio superficial facilita a germinação e evita que fiquem enterradas demais."
            },
            {
                question: "3. Por que a irrigação foi feita duas vezes ao dia com um borrifador?",
                options: [
                    { text: "Para encharcar completamente o substrato e deixar água parada no copo.", correct: false },
                    { text: "Para manter a umidade e molhar suavemente sem deslocar as sementes.", correct: true },
                    { text: "Para retirar as sementes do substrato e espalhá-las pela superfície.", correct: false }
                ],
                explanation: "O borrifador permite uma irrigação suave. Neste cultivo, a rega foi feita duas vezes ao dia para manter o substrato úmido sem mover as sementes. A necessidade pode variar conforme o calor e a umidade do ambiente."
            },
            {
                question: "4. Quanto tempo de luz solar os copos receberam por dia?",
                options: [
                    { text: "Cerca de 4 horas diárias de luz solar.", correct: true },
                    { text: "Nenhuma luz, pois a alface deve ficar sempre no escuro.", correct: false },
                    { text: "24 horas de sol direto, sem qualquer pausa.", correct: false }
                ],
                explanation: "Durante o acompanhamento do cultivo, os copos receberam cerca de 4 horas diárias de luz solar. É importante observar as mudas e evitar calor excessivo, que pode ressecar o substrato."
            },
            {
                question: "5. Por que é importante retirar ervas daninhas que crescem junto à alface?",
                options: [
                    { text: "Porque elas podem competir com a alface por água, luz e nutrientes.", correct: true },
                    { text: "Porque elas ajudam a alface a crescer mais rápido em qualquer situação.", correct: false },
                    { text: "Porque a alface só cresce quando o solo fica completamente coberto por ervas daninhas.", correct: false }
                ],
                explanation: "As ervas daninhas podem disputar água, luz e nutrientes com a alface. Manter o local de cultivo limpo ajuda a reduzir essa competição e favorece o desenvolvimento das mudas."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const progressEl = document.getElementById('progress');
        const quizSection = document.getElementById('quiz-section');
        const resultsSection = document.getElementById('results-section');
        const scoreText = document.getElementById('score-text');

        // Função para embaralhar as alternativas
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuestion() {
            resetState();
            const currentQuestion = questions[currentQuestionIndex];
            
            progressEl.innerText = `Pergunta ${currentQuestionIndex + 1} de ${questions.length}`;
            questionEl.innerText = currentQuestion.question;

            // Criar uma cópia das opções para embaralhar, assim a certa não fica sempre no mesmo lugar
            let shuffledOptions = [...currentQuestion.options];
            shuffleArray(shuffledOptions);

            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option.text;
                button.classList.add('option-btn');
                button.addEventListener('click', () => selectAnswer(button, option, currentQuestion.explanation));
                optionsEl.appendChild(button);
            });
        }

        function selectAnswer(selectedButton, option, explanation) {
            const isCorrect = option.correct;
            
            // Desativa todos os botões após a escolha
            Array.from(optionsEl.children).forEach(btn => {
                btn.disabled = true;
            });

            feedbackEl.classList.remove('success', 'error');
            feedbackEl.classList.add('show');

            if (isCorrect) {
                selectedButton.classList.add('correct');
                score++;
                feedbackEl.classList.add('success');
                feedbackEl.innerHTML = `<strong>Correto! 🌱</strong><br>${explanation}`;
            } else {
                selectedButton.classList.add('wrong');
                feedbackEl.classList.add('error');
                feedbackEl.innerHTML = `<strong>Incorreto! 🍂</strong><br>${explanation}`;
                
                // Destaca a correta
                Array.from(optionsEl.children).forEach(btn => {
                    const optionData = questions[currentQuestionIndex].options.find(o => o.text === btn.innerText);
                    if (optionData && optionData.correct) {
                        btn.style.border = "2px solid #4CAF50";
                        btn.style.color = "#4CAF50";
                    }
                });
            }

            nextBtn.style.display = 'block';
        }

        function resetState() {
            nextBtn.style.display = 'none';
            feedbackEl.classList.remove('show');
            while (optionsEl.firstChild) {
                optionsEl.removeChild(optionsEl.firstChild);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizSection.style.display = 'none';
            resultsSection.style.display = 'block';
            scoreText.innerHTML = `Você acertou <strong>${score}</strong> de <strong>${questions.length}</strong> perguntas!<br><br>Você conheceu os principais cuidados adotados no cultivo da alface crespa, desde a preparação dos copos até o registro dos primeiros brotos.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizSection.style.display = 'block';
            resultsSection.style.display = 'none';
            loadQuestion();
        }

        // Inicia o Quiz
        loadQuestion();
    </script>
</body>
</html>
